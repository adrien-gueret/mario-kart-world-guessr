<form id="photoForm">
  <input type="file" name="photo" accept=".jpg" required />
  <input type="number" name="x" placeholder="Coordonnée X" required />
  <input type="number" name="y" placeholder="Coordonnée Y" required />
  <button type="submit">Envoyer</button>
</form>

<script>
  const onSubmit2 = async (e) => {
    e.preventDefault();

    const form = e.target;
    const formData = new FormData();

    const photo = form.photo.files[0];
    const x = form.x.value;
    const y = form.y.value;

    if (!photo || !x || !y) {
      alert("Veuillez remplir tous les champs.");
      return;
    }

    formData.append("photo", photo);
    formData.append("x", x);
    formData.append("y", y);

    try {
      const response = await fetch("./api/", {
        method: "POST",
        body: formData,
      });

      const result = await response.json();

      if (response.ok) {
        alert("Photo envoyée avec succès !\nPR : " + result.pull_request_url);
      } else {
        alert("Erreur : " + (result.message || response.statusText));
      }
    } catch (err) {
      console.error(err);
      alert("Une erreur réseau s’est produite.");
    }
  };
  document.getElementById("photoForm").addEventListener("submit", onSubmit2);
</script>
